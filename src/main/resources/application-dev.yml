rate-limit:
  webhook:
    capacity: 5
    refill-rate: 1
    ttl-seconds: 300
keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:context-broker-dev}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:context-broker-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
spring:
  data:
    redis:
      host: localhost
      port: 6379
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/context_broker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/context-broker-dev}
security:
  credential-encryption:
    key: ${CREDENTIAL_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

logging:
  level:
    org.springframework.security: DEBUG

slack:
  oauth:
    client-id: ${SLACK_CLIENT_ID:test-client-id}
    client-secret: ${SLACK_CLIENT_SECRET:test-client-secret}
    signing-secret: ${SLACK_SIGNING_SECRET:test-slack-signing-secret}
    redirect-uri: ${SLACK_OAUTH_REDIRECT_URI:http://localhost:8080/integrations/slack/oauth/callback}
    scopes: ${SLACK_OAUTH_SCOPES:channels:history,channels:read}

jira:
  oauth:
    client-id: ${JIRA_CLIENT_ID}
    client-secret: ${JIRA_CLIENT_SECRET}
    redirect-uri: ${JIRA_OAUTH_REDIRECT_URI}
    scopes: ${JIRA_OAUTH_SCOPES:read:jira-work write:jira-work offline_access manage:jira-webhook}
    webhook-url: ${JIRA_WEBHOOK_URL:https://surprise-drainer-expenses.ngrok-free.dev/incoming/jira}
    webhook-jql: ${JIRA_WEBHOOK_JQL:}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}