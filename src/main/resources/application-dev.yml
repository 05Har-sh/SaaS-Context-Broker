rate-limit:
  webhook:
    capacity: 5
    refill-rate: 1
    ttl-seconds: 300
spring:
  data:
    redis:
      host: localhost
      port: 6379
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/context_broker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/context-broker-dev}
security:
  credential-encryption:
    key: ${CREDENTIAL_ENCRYPTION_KEY}

logging:
  level:
    org.springframework.security: DEBUG