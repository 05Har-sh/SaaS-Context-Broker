rate-limit:
  webhook:
    capacity: 5
    refill-rate: 1
    ttl-seconds: 300
spring:
  data:
    redis:
      host: localhost
      port: 6379
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/context_broker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/context-broker-dev}
security:
  credential-encryption:
    key: ${CREDENTIAL_ENCRYPTION_KEY:my-local-dev-default-key}

logging:
  level:
    org.springframework.security: DEBUG

slack:
  oauth:
    client-id: ${SLACK_CLIENT_ID}
    client-secret: ${SLACK_CLIENT_SECRET}
    signing-secret: ${SLACK_SIGNING_SECRET}
    redirect-uri: ${SLACK_OAUTH_REDIRECT_URI}
    scopes: ${SLACK_OAUTH_SCOPES:channels:history,channels:read}

jira:
  oauth:
    client-id: ${JIRA_CLIENT_ID}
    client-secret: ${JIRA_CLIENT_SECRET}
    redirect-uri: ${JIRA_OAUTH_REDIRECT_URI}
    scopes: ${JIRA_OAUTH_SCOPES:read:jira-work write:jira-work offline_access manage:jira-webhook}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}